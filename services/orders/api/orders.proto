syntax = "proto3";
package efab.orders.v1;

option go_package = "github.com/efab/orders/gen/go/orders;orders";
option java_multiple_files = true;
option java_package = "com.efab.orders.v1";

message OrderLot {
  string lot_id = 1;
  double quantity = 2;
  string cell_id = 3;
  string planned_start_utc = 4;
}

message OrderRouting {
  int32 seq = 1;
  string op_id = 2;
  string cell_id = 3;
  int32 changeover_sec = 4;
}

enum OrderState {
  ORDER_STATE_DRAFT = 0;
  ORDER_STATE_FIRM = 1;
  ORDER_STATE_RELEASED = 2;
  ORDER_STATE_PAUSED = 3;
  ORDER_STATE_COMPLETED = 4;
  ORDER_STATE_CANCELLED = 5;
}

message Order {
  string order_id = 1;
  string customer_ref = 2;
  string sku = 3;
  double quantity = 4;
  string uom = 5;
  OrderState state = 6;
  int32 priority = 7;
  string due_date_utc = 8;
  string site_id = 9;
  repeated OrderRouting routings = 10;
  repeated OrderLot lots = 11;
  map<string, string> metadata = 12;
}

message CreateOrderRequest {
  string customer_ref = 1;
  string sku = 2;
  double quantity = 3;
  string uom = 4;
  string due_date_utc = 5;
  string site_id = 6;
  int32 priority = 7;
  repeated OrderRouting routings = 8;
  repeated OrderLot lots = 9;
}

message GetOrderRequest {
  string order_id = 1;
}

message ListOrdersRequest {
  OrderState state_filter = 1;
  string cell_id = 2;
  string cursor = 3;
  int32 page_size = 4;
}

message ListOrdersResponse {
  repeated Order orders = 1;
  string next_cursor = 2;
}

message UpdateOrderStateRequest {
  string order_id = 1;
  OrderState state = 2;
  string reason = 3;
}

message UpdateOrderRequest {
  string order_id = 1;
  int32 priority = 2;
  string due_date_utc = 3;
  OrderState state = 4;
  string pause_reason = 5;
}

message UpsertLotsRequest {
  string order_id = 1;
  repeated OrderLot lots = 2;
}

service OrderService {
  rpc CreateOrder(CreateOrderRequest) returns (Order);
  rpc GetOrder(GetOrderRequest) returns (Order);
  rpc ListOrders(ListOrdersRequest) returns (ListOrdersResponse);
  rpc UpdateOrder(UpdateOrderRequest) returns (Order);
  rpc UpdateOrderState(UpdateOrderStateRequest) returns (Order);
  rpc UpsertLots(UpsertLotsRequest) returns (Order);
}
