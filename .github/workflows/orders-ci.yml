name: Orders Service CI

on:
  push:
    paths:
      - 'services/orders/**'
      - '.github/workflows/orders-ci.yml'
  pull_request:
    paths:
      - 'services/orders/**'
      - '.github/workflows/orders-ci.yml'

jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      PYTHON_VERSION: '3.12'
      SERVICE_DIR: services/orders
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('services/orders/requirements.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r $SERVICE_DIR/requirements.txt

      - name: Lint & type checks
        run: |
          pip install ruff mypy
          ruff check $SERVICE_DIR/app
          mypy --ignore-missing-imports $SERVICE_DIR/app

      - name: Run tests
        run: |
          pytest $SERVICE_DIR/tests -m "not integration" --maxfail=1 --disable-warnings -q

      - name: Build Docker image
        run: |
          docker build -f $SERVICE_DIR/Dockerfile -t orders-service-ci:latest $SERVICE_DIR

      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@0.20.0
        with:
          image-ref: orders-service-ci:latest
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true

  integration-tests:
    needs: build-test
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install service deps
        run: |
          python -m pip install --upgrade pip
          pip install -r services/orders/requirements.txt

      - name: Run integration tests (placeholder)
        run: |
          pytest services/orders/tests -m integration --maxfail=1 --disable-warnings || echo "Integration tests pending implementation"
