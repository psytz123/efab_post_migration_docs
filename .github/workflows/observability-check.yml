name: Observability Validation

# CI pipeline for validating Jsonnet dashboards, Prometheus rules, and observability automation
# ADR-005 follow-up implementation

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'organized/observability/**'
      - '.github/workflows/observability-check.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'organized/observability/**'

env:
  JSONNET_VERSION: "0.20.0"
  PROMETHEUS_VERSION: "2.45.0"

jobs:
  jsonnet-validation:
    name: Validate Jsonnet Syntax and Formatting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      - name: Install Jsonnet tools
        run: |
          go install github.com/google/go-jsonnet/cmd/jsonnet@latest
          go install github.com/google/go-jsonnet/cmd/jsonnetfmt@latest
          echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Check Jsonnet formatting
        run: |
          cd organized/observability
          # Check if files are properly formatted
          for file in *.jsonnet; do
            echo "Checking format: $file"
            jsonnetfmt --test "$file" || {
              echo "ERROR: $file is not properly formatted"
              echo "Run: jsonnetfmt -i $file"
              exit 1
            }
          done

      - name: Validate dashboard compilation
        run: |
          cd organized/observability
          echo "Testing dashboard_main.jsonnet compilation..."
          jsonnet dashboard_main.jsonnet \
            --tla-str site=factory-01 \
            --tla-str cell=cell-a \
            --tla-str environment=prod \
            > /tmp/dashboard.json

          # Validate JSON output
          if ! jq empty /tmp/dashboard.json 2>/dev/null; then
            echo "ERROR: Dashboard produced invalid JSON"
            exit 1
          fi

          echo "Dashboard compiled successfully"

      - name: Validate alert rules compilation
        run: |
          cd organized/observability
          echo "Testing alerts_main.jsonnet compilation..."
          jsonnet alerts_main.jsonnet \
            --tla-str site=factory-01 \
            --tla-str cell=cell-a \
            --tla-str environment=prod \
            --tla-str slack_channel=#alerts \
            > /tmp/alerts.json

          # Validate JSON output
          if ! jq empty /tmp/alerts.json 2>/dev/null; then
            echo "ERROR: Alerts produced invalid JSON"
            exit 1
          fi

          echo "Alerts compiled successfully"

      - name: Test dashboard parameterization
        run: |
          cd organized/observability
          # Test multiple parameter combinations
          for site in factory-01 factory-02; do
            for cell in cell-a cell-b; do
              for env in prod staging; do
                echo "Testing: site=$site cell=$cell env=$env"
                jsonnet dashboard_main.jsonnet \
                  --tla-str site=$site \
                  --tla-str cell=$cell \
                  --tla-str environment=$env \
                  > /tmp/test-dashboard-$site-$cell-$env.json
              done
            done
          done
          echo "All parameter combinations validated"

  prometheus-validation:
    name: Validate Prometheus Rules
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      - name: Install Jsonnet
        run: |
          go install github.com/google/go-jsonnet/cmd/jsonnet@latest
          echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Install Prometheus tools
        run: |
          wget -q https://github.com/prometheus/prometheus/releases/download/v${{ env.PROMETHEUS_VERSION }}/prometheus-${{ env.PROMETHEUS_VERSION }}.linux-amd64.tar.gz
          tar xzf prometheus-${{ env.PROMETHEUS_VERSION }}.linux-amd64.tar.gz
          sudo mv prometheus-${{ env.PROMETHEUS_VERSION }}.linux-amd64/promtool /usr/local/bin/
          promtool --version

      - name: Convert Jsonnet to Prometheus YAML
        run: |
          cd organized/observability
          # Generate Prometheus rules YAML from Jsonnet
          jsonnet alerts_main.jsonnet \
            --tla-str site=factory-01 \
            --tla-str cell=cell-a \
            --tla-str environment=prod \
            --tla-str slack_channel=#alerts \
            --yaml-stream > /tmp/alerts.yml

          echo "Generated Prometheus rules:"
          cat /tmp/alerts.yml

      - name: Validate Prometheus rules with promtool
        run: |
          echo "Validating Prometheus rules..."
          promtool check rules /tmp/alerts.yml || {
            echo "ERROR: Prometheus rule validation failed"
            exit 1
          }
          echo "Prometheus rules are valid"

      - name: Check alert annotations
        run: |
          cd organized/observability
          # Validate required annotations in alerts
          python3 - <<'EOF'
          import json
          import sys

          with open('/tmp/alerts.yml', 'r') as f:
            import yaml
            rules_data = yaml.safe_load(f)

          errors = []
          required_annotations = ['summary', 'description']
          required_labels = ['severity', 'environment']

          for group in rules_data.get('groups', []):
            for rule in group.get('rules', []):
              if 'alert' not in rule:
                continue

              alert_name = rule['alert']

              # Check labels
              labels = rule.get('labels', {})
              for req_label in required_labels:
                if req_label not in labels:
                  errors.append(f"Alert '{alert_name}' missing required label: {req_label}")

              # Check annotations
              annotations = rule.get('annotations', {})
              for req_annotation in required_annotations:
                if req_annotation not in annotations:
                  errors.append(f"Alert '{alert_name}' missing required annotation: {req_annotation}")

          if errors:
            print("ERROR: Alert validation failed:")
            for error in errors:
              print(f"  - {error}")
            sys.exit(1)
          else:
            print("All alerts have required annotations and labels")
          EOF

  metrics-schema-lint:
    name: Validate Metrics Schema
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pyyaml requests

      - name: Run metrics schema linter
        run: |
          cd organized/observability
          if [ -f metrics_lint.py ]; then
            python metrics_lint.py --strict
          else
            echo "WARNING: metrics_lint.py not found, skipping metrics validation"
            echo "Create organized/observability/metrics_lint.py to enable this check"
          fi

  runbook-validation:
    name: Validate Runbook URLs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pyyaml requests pytest pytest-cov

      - name: Run runbook validator
        run: |
          cd organized/observability
          if [ -f runbook_validator.py ]; then
            python runbook_validator.py --input alerts_main.jsonnet --fail-on-404
          else
            echo "WARNING: runbook_validator.py not found, skipping runbook validation"
            echo "Create organized/observability/runbook_validator.py to enable this check"
          fi

      - name: Run validator tests
        run: |
          cd organized/observability
          if [ -d tests ]; then
            pytest tests/ -v --cov=. --cov-report=term-missing
          else
            echo "WARNING: No tests found in organized/observability/tests/"
          fi

  integration-test:
    name: Integration Test - Full Pipeline
    runs-on: ubuntu-latest
    needs: [jsonnet-validation, prometheus-validation]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      - name: Install all tools
        run: |
          # Jsonnet
          go install github.com/google/go-jsonnet/cmd/jsonnet@latest
          echo "$HOME/go/bin" >> $GITHUB_PATH

          # Python dependencies
          pip install pyyaml requests pytest

      - name: Run full observability pipeline
        run: |
          cd organized/observability
          echo "=== Testing Full Observability Pipeline ==="

          # 1. Compile dashboard
          echo "1. Compiling dashboard..."
          jsonnet dashboard_main.jsonnet \
            --tla-str site=factory-01 \
            --tla-str cell=cell-a \
            --tla-str environment=prod \
            > /tmp/final-dashboard.json

          # 2. Compile alerts
          echo "2. Compiling alerts..."
          jsonnet alerts_main.jsonnet \
            --tla-str site=factory-01 \
            --tla-str cell=cell-a \
            --tla-str environment=prod \
            --tla-str slack_channel=#prod-alerts \
            > /tmp/final-alerts.json

          # 3. Validate outputs
          echo "3. Validating outputs..."
          jq empty /tmp/final-dashboard.json
          jq empty /tmp/final-alerts.json

          echo "=== Integration test passed ==="

      - name: Upload artifacts
        uses: actions/upload-artifact@v3
        with:
          name: compiled-observability-configs
          path: |
            /tmp/final-dashboard.json
            /tmp/final-alerts.json
          retention-days: 7
