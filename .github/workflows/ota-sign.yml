name: OTA Signing Pipeline

# Automated OTA signing workflow for edge components
# Implements ADR-007: Edge OTA & Signing Policy
# Uses Sigstore Cosign with keyless signing (GitHub OIDC)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
    paths:
      - 'edge/**'
      - 'containers/**'
      - '.github/workflows/ota-sign.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'edge/**'
      - 'containers/**'
  workflow_dispatch:
    inputs:
      component:
        description: 'Component to sign (edge-agent, opc-ua-adapter, ros2-bridge, mqtt-sparkplug)'
        required: true
        type: choice
        options:
          - edge-agent
          - opc-ua-adapter
          - ros2-bridge
          - mqtt-sparkplug
          - all
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - staging
          - production
        default: staging

env:
  REGISTRY: ghcr.io
  COSIGN_VERSION: "2.2.1"
  SLSA_VERIFIER_VERSION: "2.4.1"

permissions:
  contents: read
  packages: write
  id-token: write  # Required for OIDC keyless signing
  attestations: write

jobs:
  build-and-sign:
    name: Build, Sign & Attest OTA Components
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component:
          - edge-agent
          - opc-ua-adapter
          - ros2-bridge
          - mqtt-sparkplug

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for provenance

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: v${{ env.COSIGN_VERSION }}

      - name: Install SLSA verifier
        run: |
          wget -q https://github.com/slsa-framework/slsa-verifier/releases/download/v${{ env.SLSA_VERIFIER_VERSION }}/slsa-verifier-linux-amd64
          chmod +x slsa-verifier-linux-amd64
          sudo mv slsa-verifier-linux-amd64 /usr/local/bin/slsa-verifier
          slsa-verifier version

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.component }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build container image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./edge/${{ matrix.component }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Generate SBOM
        run: |
          docker sbom ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.component }}:${{ github.sha }} \
            --format cyclonedx-json \
            --output /tmp/${{ matrix.component }}-sbom.json

          echo "SBOM generated for ${{ matrix.component }}"
          jq '.components | length' /tmp/${{ matrix.component }}-sbom.json

      - name: Sign container image with Cosign (keyless)
        env:
          COSIGN_EXPERIMENTAL: 1
        run: |
          IMAGE_DIGEST="${{ steps.build.outputs.digest }}"
          IMAGE_REF="${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.component }}@${IMAGE_DIGEST}"

          echo "Signing image: ${IMAGE_REF}"

          # Sign with keyless workflow (GitHub OIDC)
          cosign sign --yes \
            --oidc-issuer=https://token.actions.githubusercontent.com \
            "${IMAGE_REF}"

          echo "Image signed successfully"

      - name: Attest SBOM
        env:
          COSIGN_EXPERIMENTAL: 1
        run: |
          IMAGE_DIGEST="${{ steps.build.outputs.digest }}"
          IMAGE_REF="${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.component }}@${IMAGE_DIGEST}"

          # Attach SBOM attestation
          cosign attest --yes \
            --predicate /tmp/${{ matrix.component }}-sbom.json \
            --type cyclonedx \
            "${IMAGE_REF}"

          echo "SBOM attestation attached"

      - name: Generate SLSA provenance
        uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v1.9.0
        with:
          image: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.component }}
          digest: ${{ steps.build.outputs.digest }}
          registry-username: ${{ github.actor }}
        secrets:
          registry-password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify signature
        env:
          COSIGN_EXPERIMENTAL: 1
        run: |
          IMAGE_DIGEST="${{ steps.build.outputs.digest }}"
          IMAGE_REF="${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.component }}@${IMAGE_DIGEST}"

          echo "Verifying signature on: ${IMAGE_REF}"

          # Verify with certificate identity
          cosign verify \
            --certificate-identity-regexp="https://github.com/${{ github.repository }}" \
            --certificate-oidc-issuer=https://token.actions.githubusercontent.com \
            "${IMAGE_REF}"

          echo "Signature verification successful"

      - name: Export image digest
        id: digest
        run: |
          echo "digest=${{ steps.build.outputs.digest }}" >> $GITHUB_OUTPUT
          echo "${{ matrix.component }}=${{ steps.build.outputs.digest }}" >> /tmp/component-digests.txt

      - name: Upload component digest
        uses: actions/upload-artifact@v3
        with:
          name: component-digests
          path: /tmp/component-digests.txt
          retention-days: 7

  generate-ota-manifest:
    name: Generate OTA Manifest
    runs-on: ubuntu-latest
    needs: build-and-sign

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: v${{ env.COSIGN_VERSION }}

      - name: Download component digests
        uses: actions/download-artifact@v3
        with:
          name: component-digests
          path: /tmp

      - name: Generate OTA manifest
        run: |
          chmod +x scripts/generate-ota-manifest.sh
          scripts/generate-ota-manifest.sh \
            --digests-file /tmp/component-digests.txt \
            --version ${{ github.ref_name }} \
            --commit ${{ github.sha }} \
            --output /tmp/ota-manifest.json

      - name: Sign OTA manifest
        env:
          COSIGN_EXPERIMENTAL: 1
        run: |
          # Sign the manifest file
          cosign sign-blob --yes \
            --oidc-issuer=https://token.actions.githubusercontent.com \
            --output-signature /tmp/ota-manifest.sig \
            --output-certificate /tmp/ota-manifest.crt \
            /tmp/ota-manifest.json

          echo "Manifest signed successfully"

      - name: Verify manifest signature
        env:
          COSIGN_EXPERIMENTAL: 1
        run: |
          cosign verify-blob \
            --certificate /tmp/ota-manifest.crt \
            --signature /tmp/ota-manifest.sig \
            --certificate-identity-regexp="https://github.com/${{ github.repository }}" \
            --certificate-oidc-issuer=https://token.actions.githubusercontent.com \
            /tmp/ota-manifest.json

          echo "Manifest signature verified"

      - name: Display manifest
        run: |
          echo "=== OTA Manifest ==="
          jq '.' /tmp/ota-manifest.json

      - name: Upload OTA manifest bundle
        uses: actions/upload-artifact@v3
        with:
          name: ota-manifest-bundle
          path: |
            /tmp/ota-manifest.json
            /tmp/ota-manifest.sig
            /tmp/ota-manifest.crt
          retention-days: 30

      - name: Upload to OTA registry
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        run: |
          # Upload to artifact registry or S3
          # Implementation depends on your artifact storage
          echo "Uploading OTA manifest to registry..."
          # aws s3 cp /tmp/ota-manifest.json s3://ota-manifests/${{ github.ref_name }}/
          # aws s3 cp /tmp/ota-manifest.sig s3://ota-manifests/${{ github.ref_name }}/
          # aws s3 cp /tmp/ota-manifest.crt s3://ota-manifests/${{ github.ref_name }}/

  promotion-gate:
    name: Promotion Gate - Verify Before Deploy
    runs-on: ubuntu-latest
    needs: generate-ota-manifest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: v${{ env.COSIGN_VERSION }}

      - name: Download OTA manifest
        uses: actions/download-artifact@v3
        with:
          name: ota-manifest-bundle
          path: /tmp

      - name: Verify all component signatures
        env:
          COSIGN_EXPERIMENTAL: 1
        run: |
          set -e

          echo "=== Promotion Gate: Signature Verification ==="

          # Read component digests from manifest
          COMPONENTS=$(jq -r '.components[].name' /tmp/ota-manifest.json)

          for COMPONENT in $COMPONENTS; do
            DIGEST=$(jq -r ".components[] | select(.name==\"$COMPONENT\") | .digest" /tmp/ota-manifest.json)
            IMAGE_REF="${{ env.REGISTRY }}/${{ github.repository }}/${COMPONENT}@${DIGEST}"

            echo "Verifying: ${IMAGE_REF}"

            # Verify signature exists and is valid
            cosign verify \
              --certificate-identity-regexp="https://github.com/${{ github.repository }}" \
              --certificate-oidc-issuer=https://token.actions.githubusercontent.com \
              "${IMAGE_REF}" || {
                echo "ERROR: Signature verification failed for ${COMPONENT}"
                echo "Blocking promotion to production"
                exit 1
              }

            # Verify SBOM attestation exists
            cosign verify-attestation \
              --type cyclonedx \
              --certificate-identity-regexp="https://github.com/${{ github.repository }}" \
              --certificate-oidc-issuer=https://token.actions.githubusercontent.com \
              "${IMAGE_REF}" || {
                echo "ERROR: SBOM attestation missing for ${COMPONENT}"
                echo "Blocking promotion to production"
                exit 1
              }

            echo "✓ ${COMPONENT} verified successfully"
          done

          echo "=== All components verified - PROMOTION APPROVED ==="

      - name: Verify manifest signature
        env:
          COSIGN_EXPERIMENTAL: 1
        run: |
          cosign verify-blob \
            --certificate /tmp/ota-manifest.crt \
            --signature /tmp/ota-manifest.sig \
            --certificate-identity-regexp="https://github.com/${{ github.repository }}" \
            --certificate-oidc-issuer=https://token.actions.githubusercontent.com \
            /tmp/ota-manifest.json || {
              echo "ERROR: Manifest signature verification failed"
              echo "Blocking promotion to production"
              exit 1
            }

          echo "✓ Manifest signature verified"

      - name: Check policy compliance
        run: |
          # Verify manifest has required fields
          REQUIRED_FIELDS=("version" "commit" "timestamp" "components" "rollback_reference")

          for FIELD in "${REQUIRED_FIELDS[@]}"; do
            if ! jq -e ".$FIELD" /tmp/ota-manifest.json > /dev/null; then
              echo "ERROR: Missing required field: $FIELD"
              exit 1
            fi
          done

          echo "✓ Manifest policy compliance verified"

      - name: Promotion summary
        run: |
          echo "=== PROMOTION GATE PASSED ==="
          echo "Version: $(jq -r '.version' /tmp/ota-manifest.json)"
          echo "Commit: $(jq -r '.commit' /tmp/ota-manifest.json)"
          echo "Components: $(jq -r '.components[].name' /tmp/ota-manifest.json | tr '\n' ', ')"
          echo "Safe to promote to production"

  deploy-staging:
    name: Deploy to Staging Environment
    runs-on: ubuntu-latest
    needs: promotion-gate
    if: github.ref == 'refs/heads/main'
    environment:
      name: staging
      url: https://staging.example.com

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download OTA manifest
        uses: actions/download-artifact@v3
        with:
          name: ota-manifest-bundle
          path: /tmp

      - name: Deploy to staging cell (canary)
        run: |
          echo "Deploying OTA manifest to staging canary node..."
          # Implementation: Push manifest to edge agent via API or GitOps
          # argocd app sync edge-staging-canary
          # kubectl apply -f /tmp/ota-manifest.json -n edge-staging
          echo "Staging deployment initiated"

      - name: Health check
        run: |
          echo "Waiting for staging health checks..."
          sleep 30
          # Implementation: Query edge agent health endpoint
          # curl https://staging-edge.example.com/health
          echo "Staging health check passed"

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: production
      url: https://production.example.com

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download OTA manifest
        uses: actions/download-artifact@v3
        with:
          name: ota-manifest-bundle
          path: /tmp

      - name: Deploy to production (staged rollout)
        run: |
          echo "Starting staged rollout to production..."
          echo "Phase 1: Canary cell (standby)"
          # argocd app sync edge-prod-canary

          echo "Waiting for canary validation..."
          sleep 60

          echo "Phase 2: Production cells"
          # argocd app sync edge-prod-cells

          echo "Production deployment completed"

      - name: Validation tests
        run: |
          echo "Running production validation tests..."
          # pytest tests/edge_validation/ --env=production
          echo "Production validation passed"

      - name: Create rollback snapshot
        run: |
          echo "Creating rollback reference..."
          # Save current manifest as rollback target
          # aws s3 cp /tmp/ota-manifest.json s3://ota-manifests/rollback-latest.json
          echo "Rollback snapshot created"
