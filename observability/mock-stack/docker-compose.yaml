version: "3.9"

services:
  metrics-exporter:
    image: python:3.11-slim
    container_name: orders-metrics-exporter
    working_dir: /app
    volumes:
      - ./metrics-exporter:/app:ro
    command:
      - "sh"
      - "-c"
      - "pip install --no-cache-dir prometheus_client==0.20.0 requests==2.32.3 && python exporter.py"
    environment:
      - ORDERS_BASE_URL=${ORDERS_BASE_URL:-http://host.docker.internal:8080}
      - EXPORTER_PORT=9108
      - SCRAPE_INTERVAL=10
    ports:
      - "9108:9108"

  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: orders-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=2d"
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.2.0
    container_name: orders-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
