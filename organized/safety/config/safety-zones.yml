# Safety Zone Configuration
# Per ADR-004 Safety Governance Framework
# Version: 1.0
# Last Updated: 2025-11-01

zones:
  zone_1:
    name: "Assembly Cell A"
    description: "Primary assembly area with collaborative robots"
    max_speed: 100  # mm/s
    estop_required: true
    hardware_override: true
    safety_limits:
      max_force: 150  # Newtons
      proximity_distance: 500  # mm
      collision_sensitivity: high
    plc_authority: hardware  # hardware | software
    cache_ttl: 300  # seconds
    offline_mode: fail_safe

  zone_2:
    name: "Testing Station B"
    description: "Automated testing area"
    max_speed: 200  # mm/s
    estop_required: true
    hardware_override: true
    safety_limits:
      max_force: 100  # Newtons
      proximity_distance: 300  # mm
      collision_sensitivity: medium
    plc_authority: hardware
    cache_ttl: 300
    offline_mode: fail_safe

  zone_3:
    name: "Material Handling C"
    description: "Material transfer zone"
    max_speed: 500  # mm/s
    estop_required: true
    hardware_override: true
    safety_limits:
      max_force: 200  # Newtons
      proximity_distance: 1000  # mm
      collision_sensitivity: low
    plc_authority: hardware
    cache_ttl: 300
    offline_mode: fail_safe

# Global safety settings
global:
  estop_latency_threshold_ms: 5000
  audit_log_retention_days: 90
  cache_ttl_default: 300
  offline_grace_period: 300
  hardware_authority_level: 1
  plc_authority_level: 2
  edge_authority_level: 3
  task_api_authority_level: 4
