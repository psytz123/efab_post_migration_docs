# FinOps Allocation Policy Template
version: 2025-11-01
metadata:
  owner: FinanceOps
  approval_required: true
allocation_weights:
  direct:
    material: 1.0
    labor: 1.0
    maintenance: 1.0
  shared:
    energy:
      metric: edge_energy_kwh
      driver: cell_runtime_minutes
      weight: 0.6
    overhead:
      metric: production_overhead_cost
      driver: throughput_units
      weight: 0.4
capital_projects:
  - project_id: HUMANOID-PILOT
    amortization_months: 36
    start_date: 2025-11-01
    cost_center: RBT-001
variance_thresholds:
  unit_cost: 0.05   # 5%
  roi: 0.1          # 10%
reconciliation:
  frequency: nightly
  ledger_system: ERP_FINANCE
  escalation_channel: finance-oncall
