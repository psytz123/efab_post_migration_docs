# Pre-commit hooks for eFab observability configurations
# Ensures code quality and validation before commits
#
# Installation:
#   pip install pre-commit
#   pre-commit install
#
# Usage:
#   pre-commit run --all-files

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/psf/black
    rev: 23.12.1
    hooks:
      - id: black
        language_version: python3.11
        files: \.(py)$

  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: ["--profile", "black"]

  - repo: https://github.com/pycqa/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        args: ['--max-line-length=100', '--extend-ignore=E203,W503']
        files: \.(py)$

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0
    hooks:
      - id: mypy
        additional_dependencies: [types-requests, types-PyYAML]
        args: [--ignore-missing-imports, --no-strict-optional]
        files: organized/observability/.*\.py$

  - repo: local
    hooks:
      - id: jsonnet-fmt
        name: Format Jsonnet files
        entry: bash -c 'command -v jsonnetfmt >/dev/null 2>&1 && find organized/observability -name "*.jsonnet" -exec jsonnetfmt -i {} \; || echo "WARNING: jsonnetfmt not found, skipping"'
        language: system
        files: \.jsonnet$
        pass_filenames: false

      - id: jsonnet-validate
        name: Validate Jsonnet compilation
        entry: bash -c 'command -v jsonnet >/dev/null 2>&1 && cd organized/observability && for f in *.jsonnet; do echo "Validating $f..."; jsonnet "$f" --tla-str site=factory-01 --tla-str cell=cell-a --tla-str environment=prod --tla-str slack_channel=#alerts > /dev/null || exit 1; done || echo "WARNING: jsonnet not found, skipping"'
        language: system
        files: \.jsonnet$
        pass_filenames: false

      - id: metrics-lint
        name: Lint Prometheus metrics
        entry: python organized/observability/metrics_lint.py --directory organized/observability
        language: system
        files: organized/observability/.*\.jsonnet$
        pass_filenames: false

      - id: runbook-validator
        name: Validate runbook URLs
        entry: python organized/observability/runbook_validator.py --input organized/observability/alerts_main.jsonnet --dry-run
        language: system
        files: organized/observability/alerts_main\.jsonnet$
        pass_filenames: false

  - repo: https://github.com/commitizen-tools/commitizen
    rev: v3.13.0
    hooks:
      - id: commitizen
        stages: [commit-msg]

  - repo: https://github.com/python-poetry/poetry
    rev: 1.7.1
    hooks:
      - id: poetry-check
        files: pyproject\.toml$
