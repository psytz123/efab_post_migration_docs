apiVersion: v1
kind: Secret
metadata:
  name: orders-ca
  namespace: staging
type: Opaque
stringData:
  ca.crt: |
    -----BEGIN CERTIFICATE-----
    # Replace with staging CA certificate for Orders mTLS
    -----END CERTIFICATE-----
---
apiVersion: v1
kind: Secret
metadata:
  name: orders-cert
  namespace: staging
type: kubernetes.io/tls
stringData:
  tls.crt: |
    -----BEGIN CERTIFICATE-----
    # Replace with Orders client certificate signed by staging CA
    -----END CERTIFICATE-----
  tls.key: |
    -----BEGIN PRIVATE KEY-----
    # Replace with Orders client private key
    -----END PRIVATE KEY-----
