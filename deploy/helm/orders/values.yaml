image:
  repository: ghcr.io/efab/orders-service
  tag: 0.1.0
  pullPolicy: IfNotPresent

replicaCount: 2

service:
  type: ClusterIP
  port: 8080

env:
  databaseUrl: postgresql://orders:orders@orders-db.orders.svc.cluster.local:5432/orders
  eventBrokerUrl: kafka://redpanda:9092
  featureFlagTaskIntent: true
  siteId: bk-mill-01

mtls:
  enabled: false
  caSecret: orders-ca
  certSecret: orders-cert
  certKey: tls.key
  certCrt: tls.crt

auditRetention:
  enabled: true
  years: 7
  bucket: s3://efab-audit/orders

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 200m
    memory: 256Mi

ingress:
  enabled: false

vault:
  enabled: true
  path: kv/efab/orders-service

postgres:
  enablePgcrypto: true

networkPolicy:
  enabled: true
  allowedIngress:
    - namespace: efab-gateway
    - namespace: efab-scheduler
  allowedEgress:
    - namespace: efab-kafka
    - namespace: efab-postgres
