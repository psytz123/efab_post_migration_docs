apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "orders-service.fullname" . }}
  labels:
    {{- include "orders-service.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "orders-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "orders-service.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "orders-service.serviceAccountName" . }}
      containers:
        - name: orders
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: ORDERS_DATABASE_URL
              value: {{ .Values.env.databaseUrl | quote }}
            - name: ORDERS_EVENT_BROKER_URL
              value: {{ .Values.env.eventBrokerUrl | quote }}
            - name: ORDERS_FEATURE_FLAG_TASK_INTENT
              value: {{ .Values.env.featureFlagTaskIntent | quote }}
            - name: ORDERS_SITE_ID
              value: {{ .Values.env.siteId | quote }}
            - name: ORDERS_TLS_ENABLED
              value: {{ .Values.mtls.enabled | quote }}
            - name: ORDERS_TLS_CA_FILE
              value: {{ ternary "/etc/orders/tls/ca.crt" "" .Values.mtls.enabled | quote }}
            - name: ORDERS_TLS_CERT_FILE
              value: {{ ternary "/etc/orders/tls/client.crt" "" .Values.mtls.enabled | quote }}
            - name: ORDERS_TLS_KEY_FILE
              value: {{ ternary "/etc/orders/tls/client.key" "" .Values.mtls.enabled | quote }}
            - name: ORDERS_AUDIT_RETENTION_YEARS
              value: {{ .Values.auditRetention.years | quote }}
            - name: ORDERS_AUDIT_BUCKET
              value: {{ .Values.auditRetention.bucket | quote }}
          ports:
            - containerPort: {{ .Values.service.port }}
          readinessProbe:
            httpGet:
              path: /health/ready
              port: {{ .Values.service.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: {{ .Values.service.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.mtls.enabled }}
          volumeMounts:
            - mountPath: /etc/orders/tls
              name: orders-tls
              readOnly: true
          {{- end }}
      {{- if .Values.mtls.enabled }}
      volumes:
        - name: orders-tls
          projected:
            sources:
              - secret:
                  name: {{ .Values.mtls.caSecret }}
                  items:
                    - key: ca.crt
                      path: ca.crt
              - secret:
                  name: {{ .Values.mtls.certSecret }}
                  items:
                    - key: {{ .Values.mtls.certCrt }}
                      path: client.crt
                    - key: {{ .Values.mtls.certKey }}
                      path: client.key
      {{- end }}
